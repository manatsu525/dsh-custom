name: Fix executable modes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore executable bits
        run: |
          git update-index --chmod=+x deploy.sh uninstall.sh scripts/*.sh
          if git diff --cached --quiet; then
            echo "Executable modes already correct"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: preserve executable deployment scripts"
          git push origin HEAD:main
