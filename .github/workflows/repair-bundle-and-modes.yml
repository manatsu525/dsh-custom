name: Repair bundle and modes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair bundle and modes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('plugins/client-ui-settings-reasoning/lib/client.js.gz.b64')
          s = p.read_text()
          old = '1Nr6OdkjAU7T+Fp6cP56SlHzCqC1iEPTNxrLpZHYG8gmHh1lfa1u/OTj/7kw2'
          new = 'VNr6OdkjAU7T+Fp6cP56SlHzCqC1iEPTNxrLpZHYG8gmHh1lfa1u/OTj/7kw1'
          if old not in s:
              raise SystemExit('expected corrupted bundle sequence not found')
          p.write_text(s.replace(old, new, 1))
          PY
          base64 -d plugins/client-ui-settings-reasoning/lib/client.js.gz.b64 | gzip -t
          git update-index --chmod=+x deploy.sh uninstall.sh scripts/*.sh
          if git diff --cached --quiet; then
            echo "No repair changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/client-ui-settings-reasoning/lib/client.js.gz.b64
          git commit -m "fix: repair reasoning client bundle"
          git push origin HEAD:main
